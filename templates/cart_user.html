<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static' , filename = './css/reset.css')}}">
    <link rel="stylesheet" href="{{url_for('static' , filename = './css/users/cart_user.css')}}">
    <link rel="stylesheet" href="{{url_for('static' , filename = './font/fontawesome/css/all.css')}}">
    <title>{{namepage}}</title>
</head>
<body>
<!------------------=== start header ===------------------>
    <header id="header">
        <ul id="right_header">
            <li>
                <a href="/"><img src="{{url_for('static' , filename = './image logo/mtr_shop_image.png')}}" id="header_logo" alt="logo"></a>
            </li>
            <li>
                <form action="">
                    <input type="text" id="search_products" placeholder="اسم محصول را وارد کنید">
                </form>
            </li>
        </ul>
        
        <ul id="left_header">
            {%if login == False %}
                <li>
                    <a href="/log-in" class = "about_login_sign-up"><span> <i class="fa fa-sign-in-alt"></i> وارد یا ثبت نام</span></a>
                </li>
            {%endif%}

            
            {%if login == 'true'%}
                <li>
                    <a href="/user/profile" class = "about_login_sign-up"><span> <i class="fa fa-user-circle"></i> پروفایل </span></a>
                </li>
            {%endif%}
            <li>
                <a href="/" class = "about_home"><span> <i class="fa fa-home"></i> صفحه اصلی </span></a>
            </li>
            
            <li>
                <a href="/about" class = "about_login_sign-up"><span> <i class="fa fa-user"></i> درباره من </span></a>
            </li>


        </ul>
    </header>
<!------------------=== end header ===------------------>

    
    <ul>
        {%for p in allUser_product%}
            <li>
                <a href="/products/{{p[0]}}/{{p[1]}}">
                    <img src="/static/imagesProducts/{{p[0]}}.jpg" alt="">
                    <p>{{p[1]}}</p>
                    <span>{{p[2]}}</span>
                    
                </a>
                
            </li>
        {%endfor%}
    </ul>

</body>
</html>
