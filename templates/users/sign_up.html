<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static' , filename = './css/reset.css')}}">
    <link rel="stylesheet" href="{{url_for('static' , filename = './css/users/sign_up.css')}}">
    <link rel="stylesheet" href="{{url_for('static' , filename = './font/fontawesome/css/all.css')}}">
    <title>{{namepage}}</title>
</head>
<body>
    <!--------------------__=== start form sign up user ===__-------------------->
    <div id="form_login">
        <form action="{{sign_up}}"  method="post" id="main_form_sign_up">
            <input type="" name="username" id="username" placeholder="نام کاربری">
    
            <input type="password" name="password" id="password" placeholder="پسورد">
    
            <input type="text" name="phone" id="phone" placeholder="شماره تلفن">
    
            <input type="text" name="address" id="address" placeholder="آدرس">
            
            <button type="submit" id="sign_up">تایید</button>

            <a href="" class="login">ورود</a>
        </form>
    </div>
    <!--------------------__=== end form sign up user ===__-------------------->
</body>
</html>
