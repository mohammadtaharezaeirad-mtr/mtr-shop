<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static' , filename = './css/rest.css')}}">
    <link rel="stylesheet" href="{{url_for('static' , filename = './css/home.css')}}">
    <title>{{namepage}}</title>
</head>
<body>
    <ul>
        {%for p in all_products%}
            <li>
                <a href="/products/{{p[0]}}/{{p[1]}}">
                    <img src="/static/imagesProducts/{{p[0]}}.jpg" alt="">
                    <p>{{p[1]}}</p>
                    <span>{{p[2]}}</span>
                </a>
                
            </li>
        {%endfor%}
    </ul>
</body>
</html>
