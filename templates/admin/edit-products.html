<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{namepage}}</title>
</head>
<body>
        
        <!------------------=== start form edit products ===------------------>
        <img src="/static/imagesProducts/{{one_products[0]}}.jpg" alt="">

        <form action="{{edit_products}}" method="post" enctype="multipart/form-data" >
        <label for="">نام محصول</label> <br>
        <input type="text" name="name" placeholder="نام محصول" value="{{one_products[1]}}"> <br>

        <label for="">قیمت محصول</label> <br>
        <input type="text" name="prce" placeholder="قیمت محصول" value="{{one_products[2]}}"> <br>

        <label for="">توضیحات محصول</label> <br>
        <textarea name="description"  placeholder="توضیح محصول">{{one_products[3]}}</textarea> <br>

        <label for="">موجودی محصول</label> <br>
        <input type="checkbox" name="active" {% if one_products[4] == 'on' %} checked {% endif %}> <br>

        <input type="file" name="image" id="">

        <button type="submit">تایید</button>
        </form>
        <!------------------=== end form edit products ===------------------>
</body>
</html>
